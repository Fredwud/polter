# Polter's checks on three systems: the tests, clippy, rustfmt, and the golden frames, which must
# come out bit for bit the same on every machine (the engine's promise of determinism).
name: ci
on: [push, pull_request]
# reading the code is all a check needs, also for pull requests from forks
permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Libraries for sound and gamepads (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      - name: Tests
        run: cargo test --workspace --release
      - name: Clippy
        run: cargo clippy --workspace --all-targets --release -- -D warnings
      - name: Formatting
        run: cargo fmt --all --check
      - name: Golden frames
        run: cargo build --release --workspace && python tests/golden/make.py check
