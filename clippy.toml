# Polter: what makes a game play differently on another machine. Same build, seed and input
# must give the same state and the same pixels everywhere (SPEC 6.3), so game code doesn't use
# the platform's maths library (its sin, exp, powf … differ in the last bit between macOS, Linux,
# Windows and the web; polter::math has the same functions, the same everywhere), the wall clock
# (a game's time is its ticks) or maps that iterate in a different order every run.
#
# `cargo clippy` warns about each use, and so does `polter` when it builds a game. Where a use
# can't change the game (sound, timing a frame), allow it at that spot and say why:
# #[allow(clippy::disallowed_methods, reason = "…")]

disallowed-methods = [
    { path = "f32::sin", reason = "differs between machines in the last bit: polter::math::sin" },
    { path = "f32::cos", reason = "differs between machines in the last bit: polter::math::cos" },
    { path = "f32::tan", reason = "differs between machines in the last bit: polter::math::tan" },
