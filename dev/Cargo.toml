[package]
name = "polter-dev"
version = "0.5.0"
edition = "2024"
license = "MPL-2.0"
description = "The polter program: makes, lists and opens Polter games in any folder, and runs their commands"
publish = false

# Only the engine, for the project manager's window (polter::window, polter::paint).
[dependencies]
polter = { path = "..", version = "0.5.0" }

[[bin]]
name = "polter"
path = "src/main.rs"
# documented by its --help; its docs would take the engine's place (both are called polter)
doc = false
